<div class="page-header">
  <h1>New Application</h1>
  <a routerLink="/student/dashboard" class="btn">Back</a>
</div>

@if (error) {
  <p class="error">{{ error }}</p>
}

<form (ngSubmit)="submit()" class="form">
  <label>
    Academic Year
    <input name="academic_year" [(ngModel)]="academic_year" placeholder="2025/2026" required />
    <small>Format YYYY/YYYY, consecutive years.</small>
  </label>

  <label>
    Host Institution
    <select name="host_institution_id" [(ngModel)]="host_institution_id" required>
      <option [ngValue]="null" disabled>Select an institution…</option>
      @for (inst of institutions; track inst.institution_id) {
        <option [ngValue]="inst.institution_id">{{ inst.name }} — {{ inst.city }}, {{ inst.country }}</option>
      }
    </select>
  </label>

  <label>
    Academic Coordinator
    <select name="coordinator_id" [(ngModel)]="coordinator_id" required>
      <option [ngValue]="null" disabled>Select a coordinator…</option>
      @for (coord of coordinators; track coord.user_id) {
        <option [ngValue]="coord.user_id">{{ coord.first_name }} {{ coord.last_name }}</option>
      }
    </select>
  </label>

  <label>
    Expected Mobility Period
    <select name="expected_mobility_period" [(ngModel)]="expected_mobility_period">
      <option value="first_semester">First Semester</option>
      <option value="second_semester">Second Semester</option>
      <option value="full_year">Full Year</option>
    </select>
  </label>

  <label>
    Notes <span class="optional">(optional)</span>
    <textarea name="optional_note" [(ngModel)]="optional_note" rows="3"></textarea>
  </label>

  <p class="hint">
    You will upload the Learning Agreement and its course mappings on the
    next screen.
  </p>

  <button type="submit" class="btn btn-primary" [disabled]="!canSubmit() || submitting">
    {{ submitting ? "Creating…" : "Create Application" }}
  </button>
</form>
