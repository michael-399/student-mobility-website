<nav>
  <div class="nav-left">
    @if (auth.isLoggedIn()) {
      <a [routerLink]="auth.homePath()" class="brand">Student Mobility</a>
    } @else {
      <span class="brand">Student Mobility</span>
    }
  </div>
  <div class="nav-right">
    @if (auth.isLoggedIn()) {
      <span class="nav-user">{{ displayName }}</span>
      <button class="btn-logout" (click)="logout()">Logout</button>
    }
  </div>
</nav>

<div class="container">
  <router-outlet />
</div>
