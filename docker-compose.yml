# Root-level compose for the student-mobility stack.
#
#   Frontend  http://localhost:4200  ->  Flask :5000  ->  PostgreSQL
#
# Start everything with:  docker compose up --build
# Just the backend:       docker compose up --build flask-backend

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mobility_flask
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mobility_flask"]
      interval: 5s
      timeout: 5s
      retries: 10

  flask-backend:
    build: ./services/database
    ports:
      # Published on 5001: macOS runs an AirPlay Receiver on port 5000 by
      # default, which answers before Docker's forward and returns 403.
      - "5001:5000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/mobility_flask
      # Development value. Generate a real one before deploying:
      #   python -c "import secrets; print(secrets.token_hex(32))"
      - SECRET_KEY=development-secret-key
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=http://localhost:4200
      - SEED_ON_START=true
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/database:/app
      - flask-uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    environment:
      - API_PROXY_TARGET=http://flask-backend:5000
    depends_on:
      - flask-backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200 --poll=2000"

volumes:
  pg-data:
  flask-uploads:
