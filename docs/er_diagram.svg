<svg xmlns="http://www.w3.org/2000/svg" width="780" height="960" viewBox="0 0 780 960" font-family="Helvetica, Arial, sans-serif">
  <style>
    .ent  { fill:#ffffff; stroke:#1f2937; stroke-width:2 }
    .ent2 { fill:none;    stroke:#1f2937; stroke-width:1.2 }
    .rel  { fill:#ffffff; stroke:#1f2937; stroke-width:2 }
    .rel2 { fill:none;    stroke:#1f2937; stroke-width:1.2 }
    .ln   { stroke:#1f2937; stroke-width:1.6; fill:none }
    .nm   { font-size:15px; font-weight:bold; fill:#111827; text-anchor:middle }
    .rl   { font-size:12.5px; fill:#111827; text-anchor:middle }
    .card { font-size:12px; fill:#374151; text-anchor:middle }
  </style>

  <!-- ================= lines (drawn first, boxes cover the ends) ========= -->
  <path class="ln" d="M125 96  L125 132"/>
  <path class="ln" d="M125 188 L125 220 L330 220 L330 250"/>
  <path class="ln" d="M185 96  L270 132"/>
  <path class="ln" d="M270 188 L270 230 L395 230 L395 250"/>
  <path class="ln" d="M645 96  L645 132"/>
  <path class="ln" d="M645 188 L645 220 L460 220 L460 250"/>
  <path class="ln" d="M490 280 L567 280"/>
  <path class="ln" d="M645 308 L645 350"/>
  <path class="ln" d="M300 280 L195 280"/>
  <path class="ln" d="M125 308 L125 350"/>
  <path class="ln" d="M395 310 L395 362"/>
  <path class="ln" d="M395 418 L395 450"/>
  <path class="ln" d="M395 510 L395 552"/>
  <path class="ln" d="M395 608 L395 640"/>
  <path class="ln" d="M395 696 L395 732"/>
  <path class="ln" d="M395 788 L395 820"/>

  <!-- ================= strong entities ================================== -->
  <rect class="ent" x="40"  y="40" width="170" height="56" rx="2"/>
  <text class="nm" x="125" y="74">USER</text>

  <rect class="ent" x="560" y="40" width="170" height="56" rx="2"/>
  <text class="nm" x="645" y="74">INSTITUTION</text>

  <rect class="ent" x="300" y="250" width="190" height="60" rx="2"/>
  <text class="nm" x="395" y="275">MOBILITY</text>
  <text class="nm" x="395" y="294">APPLICATION</text>

  <!-- ================= weak entities (double border) ==================== -->
  <rect class="ent"  x="560" y="350" width="170" height="56" rx="2"/>
  <rect class="ent2" x="565" y="355" width="160" height="46" rx="2"/>
  <text class="nm" x="645" y="384">STATUS CHANGE</text>

  <rect class="ent"  x="40"  y="350" width="170" height="56" rx="2"/>
  <rect class="ent2" x="45"  y="355" width="160" height="46" rx="2"/>
  <text class="nm" x="125" y="373">TRANSCRIPT</text>
  <text class="nm" x="125" y="392">OF RECORDS</text>

  <rect class="ent"  x="300" y="450" width="190" height="60" rx="2"/>
  <rect class="ent2" x="305" y="455" width="180" height="50" rx="2"/>
  <text class="nm" x="395" y="475">LEARNING</text>
  <text class="nm" x="395" y="494">AGREEMENT</text>

  <rect class="ent"  x="300" y="640" width="190" height="56" rx="2"/>
  <rect class="ent2" x="305" y="645" width="180" height="46" rx="2"/>
  <text class="nm" x="395" y="674">COURSE MAPPING</text>

  <rect class="ent"  x="300" y="820" width="190" height="56" rx="2"/>
  <rect class="ent2" x="305" y="825" width="180" height="46" rx="2"/>
  <text class="nm" x="395" y="854">EXAM RESULT</text>

  <!-- ================= relationships ==================================== -->
  <!-- SUBMITS -->
  <polygon class="rel" points="125,132 185,160 125,188 65,160"/>
  <text class="rl" x="125" y="164">SUBMITS</text>

  <!-- SUPERVISES -->
  <polygon class="rel" points="270,132 330,160 270,188 210,160"/>
  <text class="rl" x="270" y="164">SUPERVISES</text>

  <!-- HOSTED AT -->
  <polygon class="rel" points="645,132 705,160 645,188 585,160"/>
  <text class="rl" x="645" y="164">HOSTED AT</text>

  <!-- HAS HISTORY (identifying: double diamond) -->
  <polygon class="rel"  points="645,248 723,280 645,312 567,280"/>
  <polygon class="rel2" points="645,256 712,280 645,304 578,280"/>
  <text class="rl" x="645" y="284">HAS HISTORY</text>

  <!-- CERTIFIED BY (identifying) -->
  <polygon class="rel"  points="125,248 195,280 125,312 55,280"/>
  <polygon class="rel2" points="125,256 185,280 125,304 65,280"/>
  <text class="rl" x="125" y="278">CERTIFIED</text>
  <text class="rl" x="125" y="292">BY</text>

  <!-- AGREES (identifying) -->
  <polygon class="rel"  points="395,362 455,390 395,418 335,390"/>
  <polygon class="rel2" points="395,369 446,390 395,411 344,390"/>
  <text class="rl" x="395" y="394">AGREES</text>

  <!-- MAPS (identifying) -->
  <polygon class="rel"  points="395,552 455,580 395,608 335,580"/>
  <polygon class="rel2" points="395,559 446,580 395,601 344,580"/>
  <text class="rl" x="395" y="584">MAPS</text>

  <!-- GRADED AS (identifying) -->
  <polygon class="rel"  points="395,732 455,760 395,788 335,760"/>
  <polygon class="rel2" points="395,739 446,760 395,781 344,760"/>
  <text class="rl" x="395" y="764">GRADED AS</text>

  <!-- ================= cardinality / participation labels =============== -->
  <text class="card" x="152" y="114">(0,N)</text>
  <text class="card" x="357" y="242">(1,1)</text>
  <text class="card" x="252" y="112">(0,N)</text>
  <text class="card" x="422" y="244">(1,1)</text>
  <text class="card" x="672" y="114">(0,N)</text>
  <text class="card" x="487" y="242">(1,1)</text>
  <text class="card" x="528" y="270">(0,N)</text>
  <text class="card" x="672" y="338">(1,1)</text>
  <text class="card" x="240" y="270">(0,1)</text>
  <text class="card" x="152" y="338">(1,1)</text>
  <text class="card" x="423" y="332">(1,N)</text>
  <text class="card" x="423" y="442">(1,1)</text>
  <text class="card" x="423" y="532">(1,N)</text>
  <text class="card" x="423" y="632">(1,1)</text>
  <text class="card" x="423" y="722">(0,1)</text>
  <text class="card" x="423" y="812">(1,1)</text>

  <!-- ================= legend ========================================== -->
  <rect class="ent" x="40" y="912" width="26" height="16"/>
  <text x="74" y="925" font-size="12" fill="#374151">entity</text>
  <rect class="ent" x="128" y="912" width="26" height="16"/>
  <rect class="ent2" x="131" y="915" width="20" height="10"/>
  <text x="162" y="925" font-size="12" fill="#374151">weak entity</text>
  <polygon class="rel" points="262,912 288,888 262,928 236,888"/>
  <text x="296" y="925" font-size="12" fill="#374151">relationship</text>
  <polygon class="rel" points="404,912 430,888 404,928 378,888"/>
  <polygon class="rel2" points="404,915 424,888 404,925 384,888"/>
  <text x="438" y="925" font-size="12" fill="#374151">identifying relationship</text>
  <text x="620" y="925" font-size="12" fill="#374151">(min,max)</text>
</svg>
